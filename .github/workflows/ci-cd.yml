# ponytail: single build/release job on ubuntu-latest using glob artifact matching. Upgrade to separate matrix jobs if cross-platform packaging or test suites expand.
name: CI / Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run vsix:build

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openspec-ext-vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
